<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinician Signup - RevClear AI Medical Billing System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        
        .auth-header {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .auth-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .auth-form {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #5f6368;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dadce0;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }
        
        .form-group input::placeholder {
            color: #9aa0a6;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            background: #1967d2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .auth-footer {
            text-align: center;
            padding: 20px 30px;
            background: #f8f9fa;
            color: #5f6368;
        }
        
        .auth-footer a {
            color: #4285f4;
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .alert-error {
            background: #fce8e6;
            border-left: 4px solid #ea4335;
            color: #c5221f;
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-success {
            background: #e6f4ea;
            border-left: 4px solid #34a853;
            color: #137333;
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .password-requirements {
            font-size: 14px;
            color: #5f6368;
            margin-top: 8px;
        }
        
        .password-requirements ul {
            margin: 5px 0;
            padding-left: 20px;
        }
        
        .password-requirements li {
            margin: 3px 0;
        }
        
        .requirement-met {
            color: #34a853;
        }
        
        .requirement-unmet {
            color: #ea4335;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🏥 Clinician Signup</h1>
                <p>Create your clinician account to continue</p>
            </div>
            
            <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)">
                <div class="alert-error" id="errorAlert"></div>
                <div class="alert-success" id="successAlert"></div>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="Dr. Jane Smith"
                        required
                        minlength="3"
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="doctor@clinic.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Create a secure password"
                        required
                        minlength="8"
                        oninput="checkPasswordStrength()"
                    >
                    <div class="password-requirements" id="passwordRequirements">
                        <ul>
                            <li id="req-length" class="requirement-unmet">At least 8 characters</li>
                            <li id="req-upper" class="requirement-unmet">One uppercase letter</li>
                            <li id="req-lower" class="requirement-unmet">One lowercase letter</li>
                            <li id="req-number" class="requirement-unmet">One number</li>
                        </ul>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Re-enter your password"
                        required
                        minlength="8"
                    >
                </div>
                
                <button type="submit" class="btn-submit">Create Account</button>
            </form>
            
            <div class="auth-footer">
                Already registered? <a href="login.html">Login</a> | <a href="index.html">Back to Demo</a>
            </div>
        </div>
    </div>
    
    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            
            // Check length
            const lengthReq = document.getElementById('req-length');
            if (password.length >= 8) {
                lengthReq.classList.remove('requirement-unmet');
                lengthReq.classList.add('requirement-met');
            } else {
                lengthReq.classList.remove('requirement-met');
                lengthReq.classList.add('requirement-unmet');
            }
            
            // Check uppercase
            const upperReq = document.getElementById('req-upper');
            if (/[A-Z]/.test(password)) {
                upperReq.classList.remove('requirement-unmet');
                upperReq.classList.add('requirement-met');
            } else {
                upperReq.classList.remove('requirement-met');
                upperReq.classList.add('requirement-unmet');
            }
            
            // Check lowercase
            const lowerReq = document.getElementById('req-lower');
            if (/[a-z]/.test(password)) {
                lowerReq.classList.remove('requirement-unmet');
                lowerReq.classList.add('requirement-met');
            } else {
                lowerReq.classList.remove('requirement-met');
                lowerReq.classList.add('requirement-unmet');
            }
            
            // Check number
            const numberReq = document.getElementById('req-number');
            if (/[0-9]/.test(password)) {
                numberReq.classList.remove('requirement-unmet');
                numberReq.classList.add('requirement-met');
            } else {
                numberReq.classList.remove('requirement-met');
                numberReq.classList.add('requirement-unmet');
            }
        }
        
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successAlert = document.getElementById('successAlert');
            successAlert.textContent = message;
            successAlert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }
        
        function handleSignup(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (fullName.length < 3) {
                showError('Full name must be at least 3 characters long');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (password.length < 8) {
                showError('Password must be at least 8 characters long');
                return;
            }
            
            if (!/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
                showError('Password must contain uppercase, lowercase, and number');
                return;
            }
            
            // Simulate API call
            const submitButton = document.querySelector('.btn-submit');
            submitButton.disabled = true;
            submitButton.textContent = 'Creating Account...';
            
            // Simulate network delay
            setTimeout(() => {
                // In production, this would be an actual API call
                console.log('Signup Data:', {
                    fullName,
                    email,
                    password: '***hidden***'
                });
                
                showSuccess('✅ Account created successfully! Redirecting to login...');
                
                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            }, 1500);
        }
    </script>
</body>
</html>
