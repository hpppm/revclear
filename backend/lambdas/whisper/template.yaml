AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Whisper Lambda function for audio transcription using OpenAI Whisper model

Globals:
  Function:
    Timeout: 300
    MemorySize: 4096
    Runtime: python3.10
    Architectures:
      - x86_64
    Environment:
      Variables:
        WHISPER_MODEL_SIZE: base
        AWS_REGION: !Ref AWS::Region

Resources:
  WhisperTranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: revclear-whisper-transcribe
      CodeUri: .
      Description: Audio transcription using OpenAI Whisper model
      Handler: lambda_handler.lambda_handler
      EphemeralStorage:
        Size: 2048  # 2GB for model and temp files
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
        - Statement:
            # CloudWatch Logs
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
            
            # S3 Access for audio files
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub 'arn:aws:s3:::${AudioBucketName}'
                - !Sub 'arn:aws:s3:::${AudioBucketName}/*'
            
            # Optional: Transcribe for comparison
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: '*'
            
            # Optional: Bedrock for post-processing
            - Sid: BedrockAccess
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      
      RecursiveLoop: Terminate
      Tags:
        Project: RevClear
        Service: Whisper-Transcription
        Environment: !Ref Environment
      
      # API Gateway trigger
      Events:
        TranscribeApi:
          Type: Api
          Properties:
            Path: /transcribe
            Method: POST
            RestApiId: !Ref WhisperApi
        
        # S3 trigger for automatic processing
        AudioUploadEvent:
          Type: S3
          Properties:
            Bucket: !Ref AudioBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .mp3
        
        AudioUploadEventWav:
          Type: S3
          Properties:
            Bucket: !Ref AudioBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .wav
        
        AudioUploadEventM4a:
          Type: S3
          Properties:
            Bucket: !Ref AudioBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .m4a
      
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto

  # API Gateway for REST endpoint
  WhisperApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'POST, GET, OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # S3 Bucket for audio files (optional - use existing or create new)
  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-audio-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldAudio
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # CloudWatch Log Group
  WhisperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WhisperTranscribeFunction}'
      RetentionInDays: 30

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name
  
  AudioBucketName:
    Type: String
    Description: Name of the S3 bucket for audio files (leave empty to create new)
    Default: ''
  
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for API authentication
    Default: ''

Outputs:
  WhisperFunctionArn:
    Description: ARN of the Whisper Lambda function
    Value: !GetAtt WhisperTranscribeFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-WhisperFunctionArn'
  
  WhisperFunctionName:
    Description: Name of the Whisper Lambda function
    Value: !Ref WhisperTranscribeFunction
    Export:
      Name: !Sub '${AWS::StackName}-WhisperFunctionName'
  
  WhisperApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${WhisperApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/transcribe'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
  
  AudioBucketName:
    Description: S3 bucket name for audio files
    Value: !Ref AudioBucket
    Export:
      Name: !Sub '${AWS::StackName}-AudioBucket'
  
  WhisperLogGroupName:
    Description: CloudWatch Log Group name
    Value: !Ref WhisperLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroup'
