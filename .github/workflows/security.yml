name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 9am
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        language: ['typescript', 'javascript']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high --json > backend-audit.json
        continue-on-error: true
      
      - name: Run npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high --json > frontend-audit.json
        continue-on-error: true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: |
            backend-audit.json
            frontend-audit.json

  hipaa-compliance:
    name: HIPAA Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for PHI in code
        run: |
          echo "🔍 Scanning for potential PHI references..."
          
          # Check for common PHI patterns
          if grep -rn "ssn\|social.security\|social_security" \
                  --include="*.ts" --include="*.tsx" --include="*.js" \
                  backend/ frontend/ 2>/dev/null; then
            echo "⚠️  WARNING: Potential SSN references found"
          fi
          
          if grep -rn "date.of.birth\|date_of_birth\|dob" \
                  --include="*.ts" --include="*.tsx" --include="*.js" \
                  backend/ frontend/ 2>/dev/null; then
            echo "⚠️  WARNING: Potential DOB references found"
          fi
          
          echo "✅ PHI scan complete"
      
      - name: Verify encryption middleware
        run: |
          echo "🔍 Checking for security middleware..."
          
          if ! grep -q "helmet" backend/src/server.ts; then
            echo "❌ Helmet security middleware not found"
            exit 1
          fi
          
          if ! grep -q "auditLogger" backend/src/server.ts; then
            echo "❌ Audit logging middleware not found"
            exit 1
          fi
          
          echo "✅ Security middleware verified"
      
      - name: Check for exposed secrets
        run: |
          echo "🔍 Checking for exposed secrets..."
          
          # Check for hardcoded AWS keys
          if grep -rn "AKIA[0-9A-Z]{16}" \
                  --include="*.ts" --include="*.tsx" --include="*.js" \
                  backend/ frontend/ 2>/dev/null; then
            echo "❌ Potential AWS access key found in code!"
            exit 1
          fi
          
          # Check for hardcoded API keys
          if grep -rn "api[_-]key\s*=\s*['\"][a-zA-Z0-9]{20,}['\"]" \
                  --include="*.ts" --include="*.tsx" --include="*.js" \
                  backend/ frontend/ 2>/dev/null; then
            echo "❌ Potential hardcoded API key found!"
            exit 1
          fi
          
          echo "✅ No exposed secrets detected"
      
      - name: Verify HTTPS enforcement
        run: |
          echo "🔍 Checking HTTPS enforcement..."
          
          if grep -q "https://" backend/src/server.ts || \
             grep -q "secure: true" backend/src/server.ts; then
            echo "✅ HTTPS configuration found"
          else
            echo "⚠️  WARNING: Verify HTTPS is enforced in production"
          fi

  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt
      
      - name: Run Safety check
        working-directory: backend
        run: safety check --file requirements.txt --json
        continue-on-error: true
      
      - name: Run Bandit security linter
        working-directory: backend
        run: bandit -r src/python/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Upload Python security results
        uses: actions/upload-artifact@v4
        with:
          name: python-security-results
          path: backend/bandit-report.json