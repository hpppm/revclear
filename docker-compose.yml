services:
  backend:
    build:
      context: ./backend
      target: builder
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      # Note: If your DB is running locally on your machine, you might need to change
      # DB_HOST to 'host.docker.internal' in your .env file or override it here.
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: ./frontend
      target: builder
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .turbo/
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/package.json
