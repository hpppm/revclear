name:CreateAWSResources

on:
workflow_dispatch:
inputs:
action:
description:'Actiontoperform'
required:true
default:'create'
type:choice
options:
-create
-list
-destroy

jobs:
manage-aws-resources:
runs-on:ubuntu-latest
steps:
-name:Checkoutcode
uses:actions/checkout@v4

-name:ConfigureAWSCredentials
uses:aws-actions/configure-aws-credentials@v4
with:
aws-access-key-id:${{secrets.AWS_ACCESS_KEY_ID}}
aws-secret-access-key:${{secrets.AWS_SECRET_ACCESS_KEY}}
aws-region:${{secrets.AWS_REGION||'us-east-1'}}

-name:VerifyAWSConnection
run:|
echo"TestingAWSconnection..."
awsstsget-caller-identity
echo"G£àConnectedtoAWS"

-name:CreateAWSResources
if:github.event.inputs.action=='create'
run:|
cdRevClear/backend
chmod+xcreate-aws-resources.sh
./create-aws-resources.sh
env:
AWS_REGION:${{secrets.AWS_REGION||'us-east-1'}}

-name:ListAWSResources
if:github.event.inputs.action=='list'
run:|
echo"=========================================="
echo"=ƒôïCurrentAWSResources"
echo"=========================================="
echo""

echo"=ƒæÑCognitoUserPools:"
awscognito-idplist-user-pools--max-results20--query'UserPools[*].[Name,Id]'--outputtable
echo""

echo"=ƒôªS3Buckets:"
awss3ls
echo""

echo"=ƒùän+ÅRDSInstances:"
awsrdsdescribe-db-instances--query'DBInstances[*].[DBInstanceIdentifier,Engine,DBInstanceStatus,Endpoint.Address]'--outputtable
echo""

echo"=ƒöÉSecretsManager:"
awssecretsmanagerlist-secrets--query'SecretList[*].[Name,ARN]'--outputtable
echo""

echo"=ƒôèCloudWatchLogGroups:"
awslogsdescribe-log-groups--query'logGroups[*].logGroupName'--outputtable
echo""

-name:GetDatabaseCredentials
if:github.event.inputs.action=='create'
run:|
echo"=========================================="
echo"=ƒöÉRetrievingDatabaseCredentials"
echo"=========================================="

SECRET_NAME="revclear/test/database"

ifawssecretsmanagerdescribe-secret--secret-id"$SECRET_NAME"2>/dev/null;then
echo"G£àDatabasecredentialsstoredin:$SECRET_NAME"
echo""
echo"Toretrievecredentials:"
echo"awssecretsmanagerget-secret-value--secret-id$SECRET_NAME--querySecretString--outputtext"
else
echo"Gä¦n+ÅSecretnotfound:$SECRET_NAME"
fi

-name:CreateSummary
run:|
echo"###AWSResourcesManagement">>$GITHUB_STEP_SUMMARY
echo"">>$GITHUB_STEP_SUMMARY
echo"**Action:**${{github.event.inputs.action}}">>$GITHUB_STEP_SUMMARY
echo"">>$GITHUB_STEP_SUMMARY

if["${{github.event.inputs.action}}"=="create"];then
echo"G£àAWSresourcescreatedsuccessfully!">>$GITHUB_STEP_SUMMARY
echo"">>$GITHUB_STEP_SUMMARY
echo"**ResourcesCreated:**">>$GITHUB_STEP_SUMMARY
echo"-=ƒæÑCognitoUserPool">>$GITHUB_STEP_SUMMARY
echo"-=ƒôªS3Buckets(storage+frontend)">>$GITHUB_STEP_SUMMARY
echo"-=ƒùän+ÅRDSPostgreSQLDatabase">>$GITHUB_STEP_SUMMARY
echo"-=ƒöÉSecretsManager">>$GITHUB_STEP_SUMMARY
echo"-=ƒôèCloudWatchLogGroups">>$GITHUB_STEP_SUMMARY
echo"">>$GITHUB_STEP_SUMMARY
echo"**=ƒÆ¦AllresourcesareFREETIER!**">>$GITHUB_STEP_SUMMARY
elif["${{github.event.inputs.action}}"=="list"];then
echo"G£àAWSresourceslistedsuccessfully!">>$GITHUB_STEP_SUMMARY
fi

echo"">>$GITHUB_STEP_SUMMARY
echo"**NextSteps:**">>$GITHUB_STEP_SUMMARY
echo"1.Checkthejoblogsforresourcedetails">>$GITHUB_STEP_SUMMARY
echo"2.AddanynewsecretstoGitHubSecrets">>$GITHUB_STEP_SUMMARY
echo"3.Updateyourapplicationconfiguration">>$GITHUB_STEP_SUMMARY
