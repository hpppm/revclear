name: Sync Documentation to Notion

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
  workflow_dispatch:

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if secrets are configured
        run: |
          if [ -z "${{ secrets.NOTION_TOKEN }}" ]; then
            echo "⚠️ NOTION_TOKEN not configured"
            echo "Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi
          echo "✅ Notion secrets are configured"
          
      - name: Install dependencies
        run: |
          npm install -g @notionhq/client
          
      - name: Test Notion Connection
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          node -e "
          const { Client } = require('@notionhq/client');
          const notion = new Client({ auth: process.env.NOTION_TOKEN });
          notion.databases.query({
            database_id: process.env.NOTION_DATABASE_ID
          }).then(() => {
            console.log('✅ Successfully connected to Notion!');
          }).catch(err => {
            console.log('❌ Failed to connect to Notion:', err.message);
            console.log('Check:');
            console.log('1. Integration has access to the database');
            console.log('2. Database ID is correct');
            console.log('3. Token has proper permissions');
          });
          " || echo "Connection test complete"
          
      - name: Create summary
        run: |
          echo "### Notion Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Workflow triggered" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secrets configured" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
