<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinician Login - RevClear AI Medical Billing System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        
        .auth-header {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .auth-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .auth-form {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #5f6368;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dadce0;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }
        
        .form-group input::placeholder {
            color: #9aa0a6;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            color: #5f6368;
        }
        
        .remember-me input {
            margin-right: 8px;
        }
        
        .forgot-password {
            color: #4285f4;
            text-decoration: none;
            font-size: 14px;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            background: #1967d2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .auth-footer {
            text-align: center;
            padding: 20px 30px;
            background: #f8f9fa;
            color: #5f6368;
        }
        
        .auth-footer a {
            color: #4285f4;
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .alert-error {
            background: #fce8e6;
            border-left: 4px solid #ea4335;
            color: #c5221f;
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-success {
            background: #e6f4ea;
            border-left: 4px solid #34a853;
            color: #137333;
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .demo-credentials {
            background: #e8f0fe;
            border-left: 4px solid #4285f4;
            color: #1967d2;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .demo-credentials strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🏥 Clinician Login</h1>
                <p>Access your secure medical claims portal</p>
            </div>
            
            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="alert-error" id="errorAlert"></div>
                <div class="alert-success" id="successAlert"></div>
                
                <div class="demo-credentials">
                    <strong>💡 Demo Mode - Ready for Presentation</strong>
                    Demo credentials pre-filled. Just click "Login" to continue!
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="doctor@clinic.com"
                        required
                        value="dr.smith@clinic.com"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        value="Demo123!"
                    >
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" checked>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password" onclick="alert('Demo: Password reset would be sent to your email'); return false;">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn-submit">Login</button>
            </form>
            
            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a> | <a href="index.html">Back to Demo</a>
            </div>
        </div>
    </div>
    
    <script>
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            document.getElementById('successAlert').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successAlert = document.getElementById('successAlert');
            successAlert.textContent = message;
            successAlert.style.display = 'block';
            document.getElementById('errorAlert').style.display = 'none';
        }
        
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Validation
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }
            
            // Simulate API call
            const submitButton = document.querySelector('.btn-submit');
            submitButton.disabled = true;
            submitButton.textContent = 'Logging in...';
            
            // Simulate network delay and authentication
            setTimeout(() => {
                // In production, this would be an actual API call with Firebase/Supabase
                console.log('Login Data:', {
                    email,
                    password: '***hidden***'
                });
                
                showSuccess('✅ Login successful! Redirecting to RevClear AI Medical Billing System...');
                
                // Store session (in production, use proper JWT tokens)
                sessionStorage.setItem('user', JSON.stringify({
                    email,
                    name: email.split('@')[0],
                    role: 'clinician',
                    authenticated: true,
                    loginTime: new Date().toISOString()
                }));
                
                // Redirect after 1 second for smooth presentation flow
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }, 1000);
        }
        
        // Check if user is already logged in
        window.addEventListener('load', () => {
            const user = sessionStorage.getItem('user');
            if (user) {
                showSuccess('Already logged in! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        });
    </script>
</body>
</html>
