services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_CA: ${DB_SSL_CA:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONN_TIMEOUT_MS: ${DB_CONN_TIMEOUT_MS:-5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_USER_POOL_ID: ${AWS_USER_POOL_ID:?AWS_USER_POOL_ID is required}
      AWS_CLIENT_ID: ${AWS_CLIENT_ID:?AWS_CLIENT_ID is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      SOAP_API_URL: ${SOAP_API_URL:?SOAP_API_URL is required}
      CODES_API_URL: ${CODES_API_URL:?CODES_API_URL is required}
      AI_TRANSCRIBE_URL: ${AI_TRANSCRIBE_URL:?AI_TRANSCRIBE_URL is required}
      AI_SERVER_API_KEY: ${AI_SERVER_API_KEY:?AI_SERVER_API_KEY is required}
      AI_SERVER_HEALTH_URL: ${AI_SERVER_HEALTH_URL:-}
      TEST_EMAIL_DOMAIN: ${TEST_EMAIL_DOMAIN:-}
      AUTO_CONFIRM_SIGNUP: ${AUTO_CONFIRM_SIGNUP:-true}
      AUTO_LOGIN_AFTER_SIGNUP: ${AUTO_LOGIN_AFTER_SIGNUP:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUDIT_FILE_LOGGING: ${AUDIT_FILE_LOGGING:-false}
    expose:
      - "3005"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - internal

networks:
  internal:
    driver: bridge
