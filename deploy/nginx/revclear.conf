upstream revclear_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream revclear_backend {
    server backend:3005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name revclear.tech www.revclear.tech api.revclear.tech;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name revclear.tech www.revclear.tech api.revclear.tech;

    ssl_certificate /etc/letsencrypt/live/revclear.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revclear.tech/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RevClearSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location /api/ {
        proxy_pass http://revclear_backend;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://revclear_frontend;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
