name: Create AWS Resources

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - list
          - destroy

jobs:
  manage-aws-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Verify AWS Connection
        run: |
          echo "Testing AWS connection..."
          aws sts get-caller-identity
          echo "✅ Connected to AWS"

      - name: Create AWS Resources
        if: github.event.inputs.action == 'create'
        run: |
          cd RevClear/backend
          chmod +x create-aws-resources.sh
          ./create-aws-resources.sh
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: List AWS Resources
        if: github.event.inputs.action == 'list'
        run: |
          echo "=========================================="
          echo "📋 Current AWS Resources"
          echo "=========================================="
          echo ""
          
          echo "👥 Cognito User Pools:"
          aws cognito-idp list-user-pools --max-results 20 --query 'UserPools[*].[Name,Id]' --output table
          echo ""
          
          echo "📦 S3 Buckets:"
          aws s3 ls
          echo ""
          
          echo "🗄️  RDS Instances:"
          aws rds describe-db-instances --query 'DBInstances[*].[DBInstanceIdentifier,Engine,DBInstanceStatus,Endpoint.Address]' --output table
          echo ""
          
          echo "🔐 Secrets Manager:"
          aws secretsmanager list-secrets --query 'SecretList[*].[Name,ARN]' --output table
          echo ""
          
          echo "📊 CloudWatch Log Groups:"
          aws logs describe-log-groups --query 'logGroups[*].logGroupName' --output table
          echo ""

      - name: Get Database Credentials
        if: github.event.inputs.action == 'create'
        run: |
          echo "=========================================="
          echo "🔐 Retrieving Database Credentials"
          echo "=========================================="
          
          SECRET_NAME="revclear/test/database"
          
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" 2>/dev/null; then
            echo "✅ Database credentials stored in: $SECRET_NAME"
            echo ""
            echo "To retrieve credentials:"
            echo "aws secretsmanager get-secret-value --secret-id $SECRET_NAME --query SecretString --output text"
          else
            echo "ℹ️  Secret not found: $SECRET_NAME"
          fi

      - name: Create Summary
        run: |
          echo "### AWS Resources Management" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.action }}" == "create" ]; then
            echo "✅ AWS resources created successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Resources Created:**" >> $GITHUB_STEP_SUMMARY
            echo "- 👥 Cognito User Pool" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 S3 Buckets (storage + frontend)" >> $GITHUB_STEP_SUMMARY
            echo "- 🗄️ RDS PostgreSQL Database" >> $GITHUB_STEP_SUMMARY
            echo "- 🔐 Secrets Manager" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 CloudWatch Log Groups" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**💰 All resources are FREE TIER!**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event.inputs.action }}" == "list" ]; then
            echo "✅ AWS resources listed successfully!" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the job logs for resource details" >> $GITHUB_STEP_SUMMARY
          echo "2. Add any new secrets to GitHub Secrets" >> $GITHUB_STEP_SUMMARY
          echo "3. Update your application configuration" >> $GITHUB_STEP_SUMMARY
